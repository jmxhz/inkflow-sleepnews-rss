name: Verify stored SleepNews RSS fulltext (cloud)

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Number of articles to re-fetch only when live recheck is selected"
        required: false
        default: "2"
        type: choice
        options:
          - "2"
          - "5"
          - "13"
      recheck_source:
        description: "Also re-fetch originals for a private EPUB test (may hit WeChat captcha)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sleepnews-verify-fulltext
  cancel-in-progress: false

jobs:
  verify:
    name: Validate fulltext stored in public RSS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verified public fulltext RSS
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install RSS parser dependencies
        run: pip install -r requirements.txt
      - name: Verify each stored article has the complete body
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup
          root=ET.parse('feed.xml').getroot()
          assert root.tag=='rss' and root.get('version')=='2.0'
          assert root.findtext('./channel/title')=='睡前消息编辑部 · 每日新闻'
          entries=root.findall('./channel/item')
          assert 1<=len(entries)<=90
          guids=set()
          links=set()
          chars=0
          images=0
          for item in entries:
              guid=item.findtext('guid','')
              title=item.findtext('title','')
              link=item.findtext('link','')
              body=item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded','')
              desc=item.findtext('description','')
              assert guid.startswith('urn:inkflow:sleepnews:MP_WXS_3581557283_')
              assert guid not in guids
              assert title.startswith('睡前消息【20')
              assert link.startswith('https://mp.weixin.qq.com/s')
              assert body and desc==body
              assert not any(x in body for x in ('文章原址','打开公众号原文','按标题检索'))
              text=BeautifulSoup(body,'lxml').get_text(' ',strip=True)
              assert len(text)>=800, title
              chars+=len(text)
              images+=body.count('<img ')
              guids.add(guid)
              links.add(link)
          assert len(guids)==len(links)==len(entries)
          print('STORED_FULLTEXT_VERIFIED',len(entries),'articles',chars,'chars',images,'images')
          PY
      - name: Optional publisher live fetch / private EPUB check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recheck_source }}
        env:
          PYTHONUTF8: "1"
        run: |
          python private_fulltext.py --sample "${{ inputs.sample || '2' }}" --strict
          python fulltext_private.py --limit "${{ inputs.sample || '2' }}" --output "$RUNNER_TEMP/sleepnews-source-recheck.xml"
          rm -f "$RUNNER_TEMP/sleepnews-source-recheck.xml"
      # No EPUB/book/article artifacts uploaded.
