name: Verify private SleepNews fulltext (cloud)

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "How many currently indexed original articles to validate"
        required: false
        default: "2"
        type: choice
        options:
          - "2"
          - "5"
          - "13"

permissions:
  contents: read

concurrency:
  group: sleepnews-verify-private-fulltext
  cancel-in-progress: false

jobs:
  verify:
    name: Validate complete original articles and private EPUB
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public link-only feed and verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install EPUB and article parser dependencies
        run: pip install -r requirements.txt
      - name: Fetch verified full articles and validate private EPUB
        env:
          PYTHONUTF8: "1"
        run: python private_fulltext.py --sample "${{ inputs.sample || '2' }}" --strict
      - name: Validate private WhereMyLife-compatible fulltext RSS (not published)
        env:
          PYTHONUTF8: "1"
        run: |
          python fulltext_private.py --limit "${{ inputs.sample || '2' }}" --output "$RUNNER_TEMP/sleepnews-fulltext-private.xml"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from bs4 import BeautifulSoup
          path=os.path.join(os.environ['RUNNER_TEMP'],'sleepnews-fulltext-private.xml')
          root=ET.parse(path).getroot()
          items=root.findall('./channel/item')
          assert len(items)>=1
          guids=set()
          for item in items:
              guid=item.findtext('guid','')
              body=item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded','')
              desc=item.findtext('description','')
              assert guid not in guids and guid.startswith('urn:inkflow:sleepnews:')
              guids.add(guid)
              assert body==desc
              assert len(BeautifulSoup(body,'lxml').get_text(' ',strip=True))>=800
              assert '文章原址' not in body and '打开公众号原文' not in body
          print('Private fulltext RSS validation: passed; articles:',len(items))
          PY
          rm -f "$RUNNER_TEMP/sleepnews-fulltext-private.xml"
      # No artifact upload: copyrighted original article bodies and generated
      # books stay only in temporary files, never public GitHub Pages.
