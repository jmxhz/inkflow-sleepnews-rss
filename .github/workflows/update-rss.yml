name: Update SleepNews RSS (cloud only)

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleepnews-rss-scheduled-update
  cancel-in-progress: false

jobs:
  update:
    name: Discover and publish verified daily-news links
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public RSS repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public scraper dependencies
        run: pip install -r requirements.txt
      - name: Refresh latest plus last 30 days
        env:
          PYTHONUTF8: "1"
        run: python cloud_update.py --days 30 --attempts 3
      - name: Validate RSS and commit changed public summary files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse('feed.xml').getroot()
          assert root.tag=='rss' and root.get('version')=='2.0'
          assert root.findtext('./channel/title')=='睡前消息编辑部 · 每日新闻'
          items=root.findall('./channel/item')
          assert 1<=len(items)<=90
          for item in items:
              assert item.findtext('guid','').startswith('urn:inkflow:sleepnews:MP_WXS_3581557283_')
              assert item.findtext('link','').startswith('https://mp.weixin.qq.com/s')
              assert item.find('{http://purl.org/rss/1.0/modules/content/}encoded') is None
              assert item.find('description') is None
          print(f'Validated {len(items)} public RSS entries')
          PY
          git add -- feed.xml
          if [ -f retry-state.json ]; then git add -- retry-state.json; fi
          if git diff --cached --quiet; then
            echo "Nothing new; keeping existing public feed"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Auto refresh SleepNews public RSS index"
            git push origin HEAD:main
          fi
