name: Update SleepNews RSS (cloud only)

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleepnews-rss-scheduled-update
  cancel-in-progress: false

jobs:
  update:
    name: Discover and publish verified fulltext RSS articles
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public RSS repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public scraper dependencies
        run: pip install -r requirements.txt
      - name: Refresh latest plus last 30 days
        env:
          PYTHONUTF8: "1"
        run: python cloud_update.py --days 30 --attempts 3
      - name: Fetch and embed complete original article text and images
        env:
          PYTHONUTF8: "1"
        run: python hydrate_rss.py --feed feed.xml
      - name: Validate RSS and commit full articles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=ET.parse('feed.xml').getroot()
          assert root.tag=='rss' and root.get('version')=='2.0'
          assert root.findtext('./channel/title')=='睡前消息编辑部 · 每日新闻'
          items=root.findall('./channel/item')
          assert 1<=len(items)<=90
          guids=set()
          titles=set()
          links={}
          for item in items:
              uid=item.findtext('guid','')
              title=item.findtext('title','')
              link=item.findtext('link','')
              assert uid.startswith('urn:inkflow:sleepnews:MP_WXS_3581557283_')
              assert link.startswith('https://mp.weixin.qq.com/s')
              assert uid not in guids, 'Duplicate RSS guid'
              assert title not in titles, 'Duplicate daily headline'
              body=item.findtext('{http://purl.org/rss/1.0/modules/content/}encoded','')
              description=item.findtext('description','')
              from bs4 import BeautifulSoup
              assert body and description and body==description, (
                  'Each article must include identical complete HTML body in both RSS fields')
              assert len(BeautifulSoup(body,'lxml').get_text(' ',strip=True))>=800, (
                  'No truncated or link-only articles may be published')
              assert not any(label in body for label in (
                  '文章原址','打开公众号原文','按标题检索')), (
                  'No automatically appended original article footer')
              guids.add(uid)
              titles.add(title)
              links[uid]=link
          import subprocess
          original=subprocess.check_output(['git','show','HEAD:feed.xml'])
          oldroot=ET.fromstring(original)
          for old in oldroot.findall('./channel/item'):
              uid=old.findtext('guid','')
              if uid in links:
                  assert links[uid]==old.findtext('link',''), (
                      'Refusing to change a previously published article URL: '
                      'WhereMyLife treats URL changes as additional articles')
          print(f'Validated {len(items)} FULLTEXT entries; published article URLs immutable')
          PY
          git add -- feed.xml
          if [ -f retry-state.json ]; then git add -- retry-state.json; fi
          if [ -f link-recovery-state.json ]; then git add -- link-recovery-state.json; fi
          if git diff --cached --quiet; then
            echo "Nothing new; keeping existing public feed"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Auto refresh verified SleepNews fulltext RSS"
            git push origin HEAD:main
          fi
